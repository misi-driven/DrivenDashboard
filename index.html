<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #faf9f6;
  color: #1a1a1a;
  line-height: 1.5;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
@media (min-width: 768px) { .container { padding: 32px 24px; } }

/* Login overlay */
.login-overlay, .setup-overlay {
  position: fixed; inset: 0; background: #faf9f6; z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card, .setup-card {
  background: #ffffff; border: 1px solid #e8e4dc; border-radius: 16px;
  padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
}
.login-logo {
  width: 56px; height: 56px; background: #1a1a1a; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: #faf9f6; font-weight: 700; font-size: 24px; margin: 0 auto 20px;
}
.login-card h1, .setup-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.3px; }
.login-card p, .setup-card p { color: #6b6760; font-size: 14px; margin-bottom: 24px; }
.setup-card { text-align: left; max-width: 540px; }
.setup-card .setup-logo { margin: 0 0 20px 0; }
.login-card label, .setup-card label {
  display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  color: #6b6760; margin-bottom: 6px; font-weight: 500; text-align: left;
}
.login-card input, .setup-card input {
  width: 100%; padding: 14px; border: 1px solid #d8d4cc; border-radius: 8px;
  font-size: 16px; font-family: inherit; margin-bottom: 16px;
}
.login-card input:focus, .setup-card input:focus { outline: none; border-color: #1a1a1a; }
.btn-full { width: 100%; padding: 14px; font-size: 15px; }
.hint {
  background: #fef9ee; border-left: 3px solid #d4a574; padding: 12px 14px;
  font-size: 12px; color: #6b6760; border-radius: 4px; margin-bottom: 16px; text-align: left;
}
.login-error {
  background: #fdf4f3; color: #c0392b; padding: 10px 12px; border-radius: 6px;
  font-size: 13px; margin-bottom: 16px; display: none;
}
.login-error.show { display: block; }

.status-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6b6760; margin-left: 12px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6ec07a; }
.status-dot.syncing { background: #d4a574; animation: pulse 1s infinite; }
.status-dot.error { background: #c0392b; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e8e4dc;
  flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 40px; height: 40px; background: #1a1a1a; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #faf9f6; font-weight: 700; font-size: 18px; letter-spacing: -0.5px;
}
.brand-text h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.brand-text p { font-size: 13px; color: #6b6760; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

button {
  background: #1a1a1a; color: #faf9f6; border: none; padding: 9px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
  font-family: inherit; min-height: 38px;
}
button:hover { background: #333; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.secondary { background: transparent; color: #1a1a1a; border: 1px solid #d8d4cc; }
button.secondary:hover { background: #f0ede5; }
button.ghost { background: transparent; color: #6b6760; border: none; padding: 6px 10px; }
button.ghost:hover { color: #1a1a1a; background: #f0ede5; }
button.danger { background: transparent; color: #c0392b; border: 1px solid #f0d4d0; }
button.danger:hover { background: #fdf4f3; }
button.tiny { padding: 4px 10px; font-size: 11px; min-height: auto; }

/* Tabs */
.tabbar {
  display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  margin-bottom: 20px; border-bottom: 1px solid #e8e4dc; padding-bottom: 0;
}
